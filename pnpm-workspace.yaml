packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
  - "infra"

allowBuilds:
  core-js-pure: false
  dtrace-provider: false
  esbuild: true
  fallow: true
  lefthook: true
  protobufjs: false
  re2: false
  workerd: true

catalog:
  typescript: ^7.0.2
  alchemy: 2.0.0-beta.81
  "@types/node": ^24.19.1
  "@cloudflare/workers-types": ^5.20261009.1

catalogs:
  react:
    "react": ^19.3.0
    "react-dom": ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
  effect:
    "effect": ^4.0.2
    "@effect/platform-node": ^4.0.2
