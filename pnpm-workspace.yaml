packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
  - "oss/*"
  - "infra"

allowBuilds:
  # Install-time code exec — do not extend without review.
  core-js-pure: false
  dtrace-provider: false
  esbuild: true
  fallow: true
  lefthook: true
  protobufjs: false
  re2: false
  workerd: true

catalog:
  "@types/node": 24.19.1
  alchemy: 2.0.0-beta.84
  typescript: 7.0.2

catalogs:
  effect:
    "@effect/platform-bun": 4.0.2
    "@effect/platform-node": 4.0.2
    effect: 4.0.2
